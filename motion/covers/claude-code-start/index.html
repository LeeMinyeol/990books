<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=900, height=1200" />
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 400; src: url("assets/fonts/Pretendard-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
      /* 책 색: 스카이(accent) + 먹색 + 종이색. 세 가지만 쓴다 */
      :root { --sky: #38a8e8; --sky-deep: #1b6fa0; --ink: #1c1c1c; --paper: #f3efe6; --card: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 900px; height: 1200px; overflow: hidden; background: var(--paper); }
      body { font-family: "Pretendard", sans-serif; color: var(--ink); }
      #root { position: relative; width: 900px; height: 1200px; overflow: hidden; background: var(--paper); }

      .hook { position: absolute; left: 84px; top: 92px; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
      .hook b { display: inline-block; background: var(--ink); color: var(--paper); padding: 2px 14px 4px; border-radius: 6px; font-weight: 800; }
      .title { position: absolute; left: 78px; top: 162px; font-size: 136px; font-weight: 800; line-height: 1.04; letter-spacing: -0.055em; }
      .title .em { color: var(--sky-deep); }
      .eng { position: absolute; right: 52px; top: 96px; writing-mode: vertical-rl; font-size: 22px; font-weight: 700; letter-spacing: 0.32em; color: var(--sky-deep); }

      /* 그림 칸: 흩어진 파일 → 정리된 폴더 */
      .art { position: absolute; left: 0; top: 520px; width: 900px; height: 560px; }
      .file { position: absolute; width: 168px; height: 112px; background: var(--card); border: 3px solid var(--ink); border-radius: 10px;
              box-shadow: 0 10px 18px -8px rgba(28,28,28,0.28); padding: 16px 16px; font-size: 22px; font-weight: 700; }
      .file::after { content: ""; position: absolute; right: -3px; top: -3px; width: 30px; height: 30px; background: var(--paper);
                     border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); border-bottom-left-radius: 8px; }
      .file i { display: block; height: 9px; border-radius: 5px; background: #d9d4c9; margin-top: 12px; width: 78%; }
      .file i + i { width: 56%; }
      .bin { position: absolute; bottom: 64px; height: 190px; width: 230px; }
      .bin .tab { position: absolute; left: 0; top: 0; width: 104px; height: 40px; background: var(--sky); border: 3px solid var(--ink); border-bottom: 0; border-radius: 12px 12px 0 0; }
      .bin .body { position: absolute; left: 0; top: 34px; width: 230px; height: 156px; background: var(--sky); border: 3px solid var(--ink); border-radius: 0 14px 14px 14px;
                   display: flex; align-items: flex-end; padding: 0 0 20px 22px; font-size: 38px; font-weight: 800; color: var(--ink); }
      .bin .body::before { content: ""; position: absolute; left: 22px; right: 22px; top: 30px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.65); }
      .bin .body::after { content: ""; position: absolute; left: 22px; right: 70px; top: 52px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.45); }
      .flow { position: absolute; left: 0; top: 0; width: 900px; height: 560px; }

      .foot { position: absolute; left: 84px; right: 84px; bottom: 54px; display: flex; justify-content: space-between; align-items: baseline;
              border-top: 3px solid var(--ink); padding-top: 18px; font-size: 26px; }
      .foot .promise { font-weight: 700; }
      .foot .mark { font-weight: 800; letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="900" data-height="1200">
      <div class="hook"><b>코딩을 몰라도</b></div>
      <div class="title">시작하는<br /><span class="em">클로드 코드</span></div>
      <div class="eng">FOR NON-CODERS</div>

      <div class="art">
        <!-- 흩어진 파일들(위) -->
        <div class="file" style="left: 70px; top: 26px; transform: rotate(-11deg)">최종(2).txt<i></i><i></i></div>
        <div class="file" style="left: 262px; top: -6px; transform: rotate(7deg)">새 문서<i></i><i></i></div>
        <div class="file" style="left: 454px; top: 34px; transform: rotate(-5deg)">IMG_0412<i></i><i></i></div>
        <div class="file" style="left: 616px; top: 18px; transform: rotate(11deg)">수정본.csv<i></i><i></i></div>
        <div class="file" style="left: 176px; top: 150px; transform: rotate(4deg)">메모 3.txt<i></i><i></i></div>
        <div class="file" style="left: 548px; top: 158px; transform: rotate(-9deg)">견적서 최종<i></i><i></i></div>

        <!-- 정리된 폴더들(아래) -->
        <div class="bin" style="left: 70px"><div class="tab"></div><div class="body">문서</div></div>
        <div class="bin" style="left: 335px"><div class="tab"></div><div class="body">표</div></div>
        <div class="bin" style="left: 600px"><div class="tab"></div><div class="body">그림</div></div>
      </div>

      <div class="foot">
        <span class="promise">터미널 없이, 폴더 정리 하나로 끝까지</span>
        <span class="mark">99BOOKS</span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = { paused: true, seek() {}, duration() { return 1; }, time() { return 0; }, totalDuration() { return 1; } };
    </script>
  </body>
</html>
