<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title>계획표에서 새 이름이 같은 두 줄을 찾는 모습</title>
<rect width="1280" height="800" fill="#F4F3F1"/>
<g transform="translate(245 105)">
<rect x="0" y="0" width="760" height="470" rx="16" fill="#FFFFFF" stroke="#E7E5E2" stroke-width="2"/>
<text x="36" y="50" font-size="40" font-weight="700" fill="#141414" dominant-baseline="central">계획표</text>
<line x1="0" y1="96" x2="760" y2="96" stroke="#E7E5E2" stroke-width="2"/>
<text x="36" y="140" font-size="36" font-weight="400" fill="#5E5B57" dominant-baseline="central">견적 수정본.csv</text>
<text x="36" y="192" font-size="36" font-weight="400" fill="#141414" dominant-baseline="central">→ 표 / 날짜없음_견적_01.csv</text>
<line x1="24" y1="232" x2="736" y2="232" stroke="#E7E5E2" stroke-width="2"/>
<text x="36" y="272" font-size="36" font-weight="400" fill="#5E5B57" dominant-baseline="central">회의메모 최종.txt</text>
<text x="36" y="322" font-size="36" font-weight="400" fill="#141414" dominant-baseline="central">→ 문서 / 2026-11-03_회의메모_01.txt</text>
<text x="36" y="384" font-size="36" font-weight="400" fill="#5E5B57" dominant-baseline="central">회의메모 최종(2).txt</text>
<text x="36" y="434" font-size="36" font-weight="400" fill="#141414" dominant-baseline="central">→ 문서 / 2026-11-03_회의메모_01.txt</text>

<rect x="12" y="238" width="736" height="230" rx="14" fill="none" stroke="#38A8E8" stroke-width="4"/>
<circle cx="760" cy="226" r="28" fill="#38A8E8"/><text x="760" y="227" font-size="30" font-weight="800" fill="#1C1C1C" text-anchor="middle" dominant-baseline="central">1</text>
</g>
<circle cx="464.4" cy="667" r="28" fill="#38A8E8"/><text x="464.4" y="668" font-size="30" font-weight="800" fill="#1C1C1C" text-anchor="middle" dominant-baseline="central">1</text>
<text x="512.4" y="667" font-size="36" font-weight="700" fill="#141414" dominant-baseline="central">새 이름이 같은 두 줄</text>
<text x="1252" y="772" font-size="22" fill="#9A968F" text-anchor="end">설명용 목업</text>
</svg>
