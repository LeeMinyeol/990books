<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* 책 그림 규칙(docs/image-style.md)과 같은 색. accent는 이 책의 포인트컬러 */
      :root {
        --ground: #f4f3f1;
        --card: #ffffff;
        --line: #e7e5e2;
        --ink: #141414;
        --sub: #5e5b57;
        --bar: #e7e5e2;
        --accent: #38a8e8;
        --on-accent: #1c1c1c;
      }
      @font-face { font-family: "Pretendard"; font-weight: 400; src: url("assets/fonts/Pretendard-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; overflow: hidden; background: var(--ground); }
      body { font-family: "Pretendard", sans-serif; color: var(--ink); }
      #root { position: relative; width: 1280px; height: 800px; overflow: hidden; }

      /* 카메라가 움직이는 화면 전체 */
      #world { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; }
      .win { position: absolute; left: 90px; top: 70px; width: 1100px; height: 660px; background: var(--card);
             border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
      .side { position: absolute; left: 0; top: 0; width: 260px; height: 100%; border-right: 1px solid var(--line); }
      .head { position: absolute; left: 0; top: 0; width: 100%; height: 56px; border-bottom: 1px solid var(--line); }
      .ico { position: absolute; width: 24px; height: 24px; fill: none; stroke: var(--sub); stroke-width: 2;
             stroke-linecap: round; stroke-linejoin: round; }
      .boxed { position: absolute; width: 36px; height: 36px; border-radius: 10px; background: var(--ground); }
      .boxed .ico { left: 6px; top: 6px; stroke: var(--ink); }
      .row { position: absolute; left: 16px; display: flex; align-items: center; gap: 10px; font-size: 15px; }
      .row .ico { position: static; width: 18px; height: 18px; }
      .bar { position: absolute; left: 16px; height: 10px; border-radius: 5px; background: var(--bar); }
      .main { position: absolute; left: 260px; top: 0; right: 0; bottom: 0; }
      .input { position: absolute; left: 110px; right: 110px; bottom: 92px; height: 64px; border: 1px solid var(--line);
               border-radius: 14px; display: flex; align-items: center; padding: 0 18px; font-size: 15px; color: #77736e; }
      .chips { position: absolute; left: 118px; bottom: 52px; display: flex; gap: 22px; font-size: 13px; color: var(--sub); }

      /* 강조와 설명은 카메라 밖(캔버스 좌표)에 둬서 확대돼도 4px 테두리를 지킨다 */
      #mark { position: absolute; left: 597px; top: 124px; width: 118px; height: 118px; border: 4px solid var(--accent);
              border-radius: 22px; opacity: 0; }
      .badge { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
               font-size: 30px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
      #mark .badge { right: -30px; top: -30px; }
      #band { position: absolute; left: 0; right: 0; top: 590px; bottom: 0; background: var(--ground); border-top: 1px solid var(--line); opacity: 0; }
      #note { position: absolute; left: 0; right: 0; top: 660px; display: flex; justify-content: center; align-items: center;
              gap: 18px; font-size: 36px; font-weight: 700; opacity: 0; }
      #note .badge { position: static; }
      #hint { position: absolute; left: 72px; top: 30px; font-size: 22px; font-weight: 700; color: var(--sub); }
      #label { position: absolute; right: 40px; bottom: 24px; font-size: 22px; color: #716f6c; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1280" data-height="800">
      <div id="world">
        <div class="win" data-layout-ignore>
          <div class="side">
            <div class="head">
              <svg class="ico" style="left:16px;top:16px" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg>
              <svg class="ico" style="left:52px;top:16px" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg>
              <div class="boxed" style="left:150px;top:10px"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg></div>
              <div class="boxed" style="left:196px;top:10px"><svg class="ico" viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></div>
            </div>
            <div class="row" style="top:74px"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>새로 만들기</div>
            <div class="row" style="top:108px"><svg class="ico" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM15.5 15.5L20 20"/></svg>검색</div>
            <div class="bar" style="top:170px;width:150px"></div>
            <div class="bar" style="top:200px;width:190px"></div>
            <div class="bar" style="top:230px;width:130px"></div>
            <div class="bar" style="top:260px;width:170px"></div>
            <div class="bar" style="top:290px;width:140px"></div>
          </div>
          <div class="main">
            <div class="input">작업을 설명하거나 질문하세요</div>
            <div class="chips"><span>이 컴퓨터 ⌄</span><span>폴더 ⌄</span><span style="margin-left:300px">자동</span></div>
          </div>
        </div>
      </div>

      <div id="hint">앱 전체 화면</div>
      <div id="band"></div>
      <div id="mark"><div class="badge">1</div></div>
      <div id="note"><div class="badge">1</div><span>말풍선 오른쪽 &lt;/&gt; 아이콘: Code 탭</span></div>
      <div id="label">설명용 목업</div>
    </div>

    <script>
      // 카메라: 전체 화면을 1.2초 보여준 뒤 2.6배 확대. 창 왼쪽 위 모서리가 (100, 110)에 오고, Code 아이콘 가운데(304, 98)는 (656, 183)에 온다
      const S = 2.6, PX = 90 + 196 + 18, PY = 70 + 10 + 18, TX = 656, TY = 183;
      const tl = gsap.timeline({ paused: true });
      tl.to("#world", { x: TX - PX * S, y: TY - PY * S, scale: S, duration: 1.3, ease: "power2.inOut" }, 1.2);
      tl.to("#hint", { opacity: 0, duration: 0.3 }, 1.1);
      tl.fromTo("#mark", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 2.6);
      tl.to("#band", { opacity: 1, duration: 0.4 }, 2.8);
      tl.fromTo("#note", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.9);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
