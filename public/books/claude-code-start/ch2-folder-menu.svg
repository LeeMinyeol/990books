<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title>입력 상자 아래 폴더 칸을 누르면 열리는 목록과 맨 아래의 폴더 열기</title>
<rect width="1280" height="800" fill="#F4F3F1"/>
<g transform="translate(151.39999999999998 83)">
<rect x="0" y="0" width="400" height="460" rx="16" fill="#FFFFFF" stroke="#E7E5E2" stroke-width="2"/>
<text x="32" y="54" font-size="40" font-weight="400" fill="#141414" dominant-baseline="central">폴더 없음</text>
<line x1="0" y1="104" x2="400" y2="104" stroke="#E7E5E2" stroke-width="2"/>
<text x="32" y="154" font-size="40" font-weight="400" fill="#5E5B57" dominant-baseline="central">최근</text>
<rect x="32" y="219" width="200" height="22" rx="11" fill="#E7E5E2"/>
<rect x="32" y="295" width="160" height="22" rx="11" fill="#E7E5E2"/>
<line x1="0" y1="356" x2="400" y2="356" stroke="#E7E5E2" stroke-width="2"/>
<text x="32" y="406" font-size="40" font-weight="400" fill="#141414" dominant-baseline="central">폴더 열기…</text>
<path d="M3 7h7l2 2h9v10H3z" transform="translate(24 580) scale(1.6666666666666667)" fill="none" stroke="#5E5B57" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="600" font-size="40" fill="#141414" dominant-baseline="central">폴더</text>
<path d="M6 9l6 6 6-6" transform="translate(162.8 586) scale(1.1666666666666667)" fill="none" stroke="#5E5B57" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="8" y="372" width="384" height="68" rx="12" fill="#38A8E8" fill-opacity="0.16" stroke="#38A8E8" stroke-width="3"/>
<circle cx="440" cy="406" r="28" fill="#38A8E8"/><text x="440" y="407" font-size="30" font-weight="800" fill="#1C1C1C" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="6" y="558" width="208.8" height="84" rx="14" fill="none" stroke="#38A8E8" stroke-width="4"/>
<circle cx="226.8" cy="546" r="28" fill="#38A8E8"/><text x="226.8" y="547" font-size="30" font-weight="800" fill="#1C1C1C" text-anchor="middle" dominant-baseline="central">1</text>
</g>
<circle cx="713.4" cy="352" r="28" fill="#38A8E8"/><text x="713.4" y="353" font-size="30" font-weight="800" fill="#1C1C1C" text-anchor="middle" dominant-baseline="central">1</text>
<text x="761.4" y="352" font-size="36" font-weight="700" fill="#141414" dominant-baseline="central">입력 상자 아래 폴더 칸</text>
<circle cx="713.4" cy="448" r="28" fill="#38A8E8"/><text x="713.4" y="449" font-size="30" font-weight="800" fill="#1C1C1C" text-anchor="middle" dominant-baseline="central">2</text>
<text x="761.4" y="448" font-size="36" font-weight="700" fill="#141414" dominant-baseline="central">폴더 열기… 로 고르기</text>
<text x="1252" y="772" font-size="22" fill="#9A968F" text-anchor="end">설명용 목업</text>
</svg>
