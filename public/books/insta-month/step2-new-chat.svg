  <g fill="#e4e4e7"><rect x="58" y="160" width="140" height="12" rx="6"/><rect x="58" y="192" width="110" height="12" rx="6"/><rect x="58" y="224" width="150" height="12" rx="6"/><rect x="58" y="256" width="100" height="12" rx="6"/></g>
